[package]
name = "netchecker"
version = "0.1.0"
edition = "2021"
description = "Диагностика интернет-соединения по модели OSI с наглядной схемой сети"
license = "MIT"
repository = "https://github.com/Solevaral/NETchecker"

[[bin]]
name = "netchecker"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dependencies]
auto-launch = "0.6.0"
directories = "6.0.0"
eframe = "0.36.0"
netdev = "0.45.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
socket2 = { version = "0.6.5", features = ["all"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
tray-icon = "0.24.2"
ureq = { version = "3.3.0", default-features = false, features = ["rustls"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock"] }
