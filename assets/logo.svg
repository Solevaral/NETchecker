<!--
  Мастер-эскиз логотипа Netchecker.

  В самой программе иконка не читается из файла, а рисуется кодом
  (src/logo.rs) — так её можно получить в любом размере и перекрасить под
  состояние мониторинга в трее. Геометрия здесь один в один совпадает с той,
  что задана в коде: если меняете рисунок, меняйте оба места.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <title>Netchecker</title>

  <!-- Подложка. Поле по краю оставлено намеренно: на панели задач иконка
       не должна упираться в соседей. -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="#101B33"/>

  <!-- Связи между узлами. Нижнее ребро не рисуется — его роль играет
       линия пульса. -->
  <g stroke="#2F5FB5" stroke-width="8" stroke-linecap="round">
    <line x1="216" y1="150" x2="128" y2="66"/>
    <line x1="128" y1="66"  x2="40"  y2="150"/>
  </g>

  <!-- Линия пульса: «проверка связи». -->
  <polyline points="40,150 80,150 100,112 126,192 150,132 170,150 216,150"
            fill="none" stroke="#3DDC97" stroke-width="15"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Узлы сети. -->
  <g fill="#58A6FF">
    <circle cx="40"  cy="150" r="15"/>
    <circle cx="216" cy="150" r="15"/>
    <circle cx="128" cy="66"  r="15"/>
  </g>
</svg>
